name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm install --no-audit --no-fund 2>&1 | tee build-output.txt
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
            rm -rf dist
            npm run build 2>&1 | tee -a build-output.txt
            status=${PIPESTATUS[0]}
          fi

          if [ "$status" -ne 0 ]; then
            {
              echo "El build automático falló en el commit $GITHUB_SHA."
              echo
              echo '```text'
              tail -c 50000 build-output.txt
              echo
              echo '```'
            } > issue-body.md
            gh issue create --title "Build failure: ${GITHUB_SHA:0:7}" --body-file issue-body.md
            exit "$status"
          fi

          printf '%s\n' "$GITHUB_SHA" > dist/version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
