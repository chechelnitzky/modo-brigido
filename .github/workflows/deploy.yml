name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Restore PR summary
        run: node scripts/restore-pr-line.mjs

      - name: Build application
        run: |
          rm -rf dist
          npm run build
          printf '%s\n' "$GITHUB_SHA" > dist/version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  persist:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore PR summary
        run: node scripts/restore-pr-line.mjs

      - name: Commit upgraded source
        run: |
          if ! git diff --quiet -- src/pages/WorkoutSessionPageV2.tsx src/exercise-library.css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages/WorkoutSessionPageV2.tsx src/exercise-library.css
            git commit -m "ui: restore compact PR and e1RM summary"
            git push
          fi

  report:
    runs-on: ubuntu-latest
    if: always()
    needs: [build, deploy]
    steps:
      - name: Report deploy result
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            STATE=success
            DESCRIPTION="Modo Brígido deployed to GitHub Pages"
          else
            STATE=failure
            DESCRIPTION="Modo Brígido GitHub Pages deploy failed"
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"github-pages\",\"description\":\"${DESCRIPTION}\"}"
