name: Temp hide duplicate PR

on:
  push:
    branches: [feature/hide-duplicate-load-pr]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hide-duplicate-load-pr
      - name: Patch duplicate PR display
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/WorkoutSessionPageV2.tsx')
          text = path.read_text()
          old = """          const history = mergeBestMetrics(historicalHistory, liveBest);\n          const liveMetricAvailable = liveBest.estimatedOneRepMax > 0 || liveBest.loadPrWeight > 0;\n          return ("""
          new = """          const history = mergeBestMetrics(historicalHistory, liveBest);\n          const liveMetricAvailable = liveBest.estimatedOneRepMax > 0 || liveBest.loadPrWeight > 0;\n          const loadPrDuplicatesE1rm = history.loadPrWeight === history.prWeight && history.loadPrReps === history.prReps;\n          return ("""
          if old not in text:
              raise SystemExit('first target not found')
          text = text.replace(old, new, 1)
          old2 = """                  <small style={{ display: 'block', marginTop: 2 }}>PR de carga: {lastWeightsLoading && !liveMetricAvailable ? '…' : history.loadPrWeight > 0 ? `${formatWeightKg(history.loadPrWeight)} kg × ${history.loadPrReps}` : '0 kg'}</small>"""
          new2 = """                  {!loadPrDuplicatesE1rm && <small style={{ display: 'block', marginTop: 2 }}>PR de carga: {lastWeightsLoading && !liveMetricAvailable ? '…' : history.loadPrWeight > 0 ? `${formatWeightKg(history.loadPrWeight)} kg × ${history.loadPrReps}` : '0 kg'}</small>}"""
          if old2 not in text:
              raise SystemExit('second target not found')
          text = text.replace(old2, new2, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/WorkoutSessionPageV2.tsx
          git commit -m "Hide duplicate load PR when it matches e1RM PR"
          git push
